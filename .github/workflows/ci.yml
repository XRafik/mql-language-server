name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore MqlLanguageServer.sln

      - name: Build
        run: dotnet build MqlLanguageServer.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test MqlLanguageServer.sln
          --no-build
          --configuration Release
          --filter "FullyQualifiedName!~Performance&FullyQualifiedName!~FpMeasurement&Category!=RealWorld"

      - name: Vulnerable packages gate
        run: dotnet list MqlLanguageServer.sln package --vulnerable --include-transitive

  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Compile, test and package
        working-directory: vscode/mql-language-server
        run: |
          npm ci
          npm run compile
          npx vitest run
          npm run package