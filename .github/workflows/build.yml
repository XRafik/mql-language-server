name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag para release (ej. v1.0.17)'
        required: false
        default: 'manual-run'

permissions:
  contents: write
  actions: write

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  get-effective-tag:
    name: Get effective tag
    runs-on: ubuntu-latest
    outputs:
      effective_tag: ${{ steps.set-tag.outputs.effective_tag }}
      is_tag_trigger: ${{ steps.set-tag.outputs.is_tag_trigger }}
    steps:
      - name: Set effective tag
        id: set-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.inputs.tag || 'manual-run' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$DISPATCH_TAG"
            IS_TAG_TRIGGER="false"
          else
            TAG="$REF_NAME"
            IS_TAG_TRIGGER="true"
          fi
          echo "effective_tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_tag_trigger=$IS_TAG_TRIGGER" >> $GITHUB_OUTPUT

  smoke-test-linux-arm64:
    name: Smoke test linux-arm64 (native runner)
    needs: get-effective-tag
    runs-on: ubuntu-24.04-arm
    if: needs.get-effective-tag.outputs.is_tag_trigger == 'true' || startsWith(needs.get-effective-tag.outputs.effective_tag, 'v')
    steps:
      - name: Checkout (privado)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Cross-published IL is architecture-independent, but this job proves
      # the arm64 artifact actually RUNS on arm64 hardware (issue #47):
      # publish on the native runner and complete an LSP initialize handshake.
      - name: Publish linux-arm64 (native)
        run: |
          dotnet publish src/MqlLanguageServer.Server.csproj \
            -c Release -r linux-arm64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false \
            --output bin_temp/arm64

      - name: LSP initialize handshake
        run: |
          # Issue #58: stdin must stay open after the request — an immediate
          # EOF shuts the server down before it processes the queued
          # initialize message, and the response is lost (the original
          # one-shot printf made every handshake fail this way, on any
          # platform). Hold stdin ~12s, well inside the 15s timeout.
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"processId":null,"rootUri":null,"capabilities":{}}}'
          set +e
          (printf 'Content-Length: %d\r\n\r\n%s' "${#REQ}" "$REQ"; sleep 12) \
            | timeout 15 bin_temp/arm64/mql-lsp-server > handshake.out 2>/dev/null
          set -e
          grep -q '"capabilities"' handshake.out
          echo "LSP initialize handshake OK (linux-arm64 native)"

  smoke-test-win-arm64:
    name: Smoke test win-arm64 (native runner)
    needs: get-effective-tag
    runs-on: windows-11-arm
    if: needs.get-effective-tag.outputs.is_tag_trigger == 'true' || startsWith(needs.get-effective-tag.outputs.effective_tag, 'v')
    steps:
      - name: Checkout (privado)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Same rationale as the linux-arm64 job (issue #47, extended by issue #49):
      # prove the arm64 artifact actually RUNS on arm64 Windows hardware by
      # publishing on the native runner and completing an LSP initialize handshake.
      - name: Publish win-arm64 (native)
        shell: bash
        run: |
          dotnet publish src/MqlLanguageServer.Server.csproj \
            -c Release -r win-arm64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false \
            --output bin_temp/arm64

      - name: LSP initialize handshake
        shell: bash
        run: |
          # Issue #58: stdin must stay open after the request (see the
          # linux-arm64 job for the full rationale) — an immediate EOF loses
          # the response. $! is the pipeline's last element (the server).
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"processId":null,"rootUri":null,"capabilities":{}}}'
          set +e
          (printf 'Content-Length: %d\r\n\r\n%s' "${#REQ}" "$REQ"; sleep 12) \
            | ./bin_temp/arm64/mql-lsp-server.exe > handshake.out 2>/dev/null &
          SERVER_PID=$!
          set -e
          for _ in $(seq 1 15); do
            if grep -q '"capabilities"' handshake.out; then break; fi
            sleep 1
          done
          kill "$SERVER_PID" 2>/dev/null || true
          grep -q '"capabilities"' handshake.out
          echo "LSP initialize handshake OK (win-arm64 native)"

  publish-binaries:
    name: Publish all platforms
    needs: get-effective-tag
    runs-on: ubuntu-latest
    if: needs.get-effective-tag.outputs.is_tag_trigger == 'true' || startsWith(needs.get-effective-tag.outputs.effective_tag, 'v')
    permissions:
      # Create/update the GitHub release and clean up old workflow artifacts
      contents: write
      actions: write
      # GitHub OIDC token issuance for NuGet Trusted Publishing (nuget.org)
      id-token: write
    outputs:
      tag: ${{ needs.get-effective-tag.outputs.effective_tag }}
    steps:
      - name: Checkout (privado)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Fail the release if the effective tag does not match the package version in the csproj,
      # preventing a mismatched tag/package pair from being published.
      # Issue #79: on workflow_dispatch, GITHUB_REF_NAME is the branch (e.g. main),
      # not the tag — derive the version from the job's effective tag instead.
      - name: Verify tag matches package version
        env:
          EFFECTIVE_TAG: ${{ needs.get-effective-tag.outputs.effective_tag }}
        run: |
          CS_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/MqlLanguageServer.Server.csproj | head -1)
          TAG_VERSION="${EFFECTIVE_TAG#v}"
          if [[ "$TAG_VERSION" != "$CS_VERSION" ]]; then
            echo "::error::Tag '$EFFECTIVE_TAG' does not match csproj version '$CS_VERSION'."
            echo "::error::Update <Version> in src/MqlLanguageServer.Server.csproj to '$TAG_VERSION' and tag again."
            exit 1
          fi
          echo "Tag matches package version: $CS_VERSION"

      - name: Restore & Test
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          # Skip performance tests in CI (they're flaky due to timing variations in GitHub Actions workers)
          # Use CI environment variable set by GitHub Actions
          echo "Running tests excluding Performance folder..."
          dotnet test --no-build -c Release --filter "FullyQualifiedName!~Performance"

      # CAMBIO IMPORTANTE: Renombramos los archivos al publicarlos para que no se llamen igual
      - name: Publish & Rename Binaries
        run: |
          platforms=("linux-x64" "linux-arm64" "osx-x64" "osx-arm64" "win-x64" "win-arm64")
          outputs=("linux" "linux-arm64" "osx-x64" "osx-arm64" "win" "win-arm64")
          names=("mql-lsp-server-linux-x64" "mql-lsp-server-linux-arm64" "mql-lsp-server-osx-x64" "mql-lsp-server-osx-arm64" "mql-lsp-server-win-x64.exe" "mql-lsp-server-win-arm64.exe")
          
          for i in "${!platforms[@]}"; do
            rid="${platforms[$i]}"
            out_dir="${outputs[$i]}"
            final_name="${names[$i]}"
            
            echo "Building $rid → $final_name"
            
            dotnet publish src/MqlLanguageServer.Server.csproj \
              -c Release -r "$rid" --self-contained true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:DebugType=None -p:DebugSymbols=false \
              --output "bin_temp/$out_dir"
            
            mkdir -p bin
            if [[ "$rid" == win-* ]]; then
              mv "bin_temp/$out_dir/mql-lsp-server.exe" "bin/$final_name"
            else
              mv "bin_temp/$out_dir/mql-lsp-server" "bin/$final_name"
            fi
          done
    
          chmod +x bin/mql-lsp-server-*  

      - name: Generate CHECKSUMS.txt
        env:
          EFFECTIVE_TAG: ${{ needs.get-effective-tag.outputs.effective_tag }}
        run: |
          cd bin
          # Generate checksums with header
          echo "# SHA256 checksums for $EFFECTIVE_TAG" > CHECKSUMS.txt
          echo "# Generated: $(date -u '+%Y-%m-%d')" >> CHECKSUMS.txt
          echo "" >> CHECKSUMS.txt
          find . -type f -name "mql-lsp-server-*" -exec sha256sum {} \; >> CHECKSUMS.txt
          cat CHECKSUMS.txt

      - name: Pack NuGet
        run: dotnet pack src/MqlLanguageServer.Server.csproj -c Release --no-build --output nupkg/

      # VS Code extension (issue #70): build, test and package the client, then
      # move the VSIX into bin/ with the release tag in its name. The extension
      # version (package.json) is independent of the server tag, so the asset
      # is renamed here to carry the effective tag.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build VS Code extension
        env:
          EFFECTIVE_TAG: ${{ needs.get-effective-tag.outputs.effective_tag }}
        run: |
          cd vscode/mql-language-server
          npm ci && npm test && npm run package
          cd ../..
          mkdir -p bin
          # Glob instead of a fixed name: vsce names the artifact
          # <publisher>-<name>-<version>.vsix and the version changes over time.
          mv vscode/mql-language-server/*mql-language-server-*.vsix \
            "bin/mql-language-server-${EFFECTIVE_TAG}.vsix"
          ls -l "bin/mql-language-server-${EFFECTIVE_TAG}.vsix"

      # NuGet Trusted Publishing: exchange the GitHub Actions OIDC token for a
      # short-lived (1h, single-use) API key instead of storing a long-lived secret.
      # Requires a one-time Trusted Publishing policy on nuget.org for
      # owner=davalillo, repo=mql-language-server, workflow file=build.yml.
      # See docs/guides/DISTRIBUTION.md.
      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet package to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push nupkg/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Cleanup old artifacts BEFORE upload
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          EFFECTIVE_TAG: ${{ needs.get-effective-tag.outputs.effective_tag }}
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            // Keep only artifacts from current release
            const keepVersions = [process.env.EFFECTIVE_TAG];
            for (const artifact of artifacts.data.artifacts) {
              const shouldKeep = keepVersions.some(v => artifact.name.includes(v));
              if (!shouldKeep && !artifact.expired) {
                console.log(`Deleting: ${artifact.name}`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }

      # - name: Upload artifacts
      #   if: ${{ !env.ACT && !github.event.act }}
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: binaries-${{ needs.get-effective-tag.outputs.effective_tag }}
      #     path: |
      #       bin/
      #       nupkg/
      #     retention-days: 1  # Auto-delete after 1 day

      - name: Create/Update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.get-effective-tag.outputs.effective_tag }}
          name: "${{ needs.get-effective-tag.outputs.effective_tag }}"
          body: |
            Binaries y paquete NuGet para la versión ${{ needs.get-effective-tag.outputs.effective_tag }}.

            ### Archivos disponibles:
            - **Windows:** `mql-lsp-server-win-x64.exe`
            - **Windows (ARM64):** `mql-lsp-server-win-arm64.exe`
            - **Linux (x64):** `mql-lsp-server-linux-x64`
            - **Linux (ARM64):** `mql-lsp-server-linux-arm64`
            - **macOS (Intel):** `mql-lsp-server-osx-x64`
            - **macOS (M1/M2/M3):** `mql-lsp-server-osx-arm64`
            - **VS Code (extensión):** `mql-language-server-${{ needs.get-effective-tag.outputs.effective_tag }}.vsix`
            - **Checksums:** `CHECKSUMS.txt` (verifica integridad de archivos)

            _El código fuente adjunto abajo (Source code zip) contiene el código completo de este repositorio._

            ### Verificación de integridad:
            ```bash
            sha256sum -c CHECKSUMS.txt
            ```
          files: |
            bin/mql-lsp-server-linux-x64
            bin/mql-lsp-server-linux-arm64
            bin/mql-lsp-server-osx-x64
            bin/mql-lsp-server-osx-arm64
            bin/mql-lsp-server-win-x64.exe
            bin/mql-lsp-server-win-arm64.exe
            bin/mql-language-server-${{ needs.get-effective-tag.outputs.effective_tag }}.vsix
            bin/CHECKSUMS.txt
            nupkg/*.nupkg
          draft: false
          prerelease: ${{ contains(needs.get-effective-tag.outputs.effective_tag, '-') }}
          make_latest: ${{ !contains(needs.get-effective-tag.outputs.effective_tag, '-') }}

      - name: Cleanup old artifacts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          EFFECTIVE_TAG: ${{ needs.get-effective-tag.outputs.effective_tag }}
        with:
          script: |
            // Get the 2 most recent releases
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 2
            });

            // Extract tag names from the 2 latest releases
            const keepVersions = releases.data.map(r => r.tag_name);

            // Also add current tag if it's a new release (not in releases list yet)
            const currentTag = process.env.EFFECTIVE_TAG;
            if (!keepVersions.includes(currentTag)) {
              keepVersions.push(currentTag);
            }

            console.log('Keeping artifacts for versions:', keepVersions);

            // Get all artifacts
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            // Delete artifacts that don't match the keep versions
            for (const artifact of artifacts.data.artifacts) {
              const shouldKeep = keepVersions.some(v => artifact.name.includes(v));
              if (!shouldKeep && !artifact.expired) {
                console.log(`Deleting artifact: ${artifact.name}`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }